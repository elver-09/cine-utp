<!DOCTYPE html>
<html lang="es">
<head>
	<link rel="stylesheet" href="styles/estilo.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina de Registro</title>
</head>
<body>
    <header>
        <div class="contenedor header-contenido">
            <a href="Index.html" class="marca">
                &#x1F3AC; CINE UTP
            </a>
            <nav class="menu">
                <a href="Index.html">Inicio</a>
                <a href="Servicios.html">Servicios</a>
                <a href="Contacto.html">Contacto</a>
                <a href="Tabla.html">Tabla</a>
                <a href="Registro.html" class="activo">Registro</a>
            </nav>
        </div>
    </header>
    <main>
        <section class="registro">
            <div class="contenedor">
                <h1>Registro de Cine UTP</h1>
                <p>Completa tus Datos Para Registrarse</p>
                <form class="formulario-registro">
                    <fieldset>
                        <legend>Datos Personales</legend>
                        <div class="campo">
                            <label for="nombre">Nombre:</label>
                            <input type="text" id="nombre" name="nombre" placeholder="Ingrese su Nombre" required minlength="4">
                        </div>
                        <div class="campo">
                            <label for="email">Email:</label>
                            <input type="email" id="email" name="email" placeholder="Ingrese su Email" required maxlength="20">
                        </div>
                        <div class="campo">
                            <label>Sexo:</label>
                            <div class="opciones">
                                <label>
                                    <input type="radio" name="sexo" value="masculino">Masculino
                                </label>
                                <label>
                                    <input type="radio" name="sexo" value="femenino">Femenino
                                </label>
                            </div>
                        </div>
                    </fieldset>
                    <fieldset>
                        <legend>Preferencias</legend>
                        <div class="campo">
                            <label for="pelicula">Seleccione su Película Favorita:</label>
                            <select id="pelicula" name="pelicula">
                                <option value="pelicula1">Harry Potter</option>
                                <option value="pelicula2">Rapidos y Furiosos</option>
                                <option value="pelicula3">Spider-Man</option>
                                <option value="pelicula4">El Señor de los Anillos</option>
                                <option value="pelicula5">El Padrino</option>
                            </select>
                        </div>
                        <div class="campo">
                            <label for="opinion">Opinión:</label>
                            <textarea id="opinion" name="opinion" rows="5" placeholder="Ingrese su opinión sobre la película"></textarea>
                        </div>
                    </fieldset>
                    <fieldset>
                        <legend>Multimedia</legend>
                        <div class="multimedia">
                            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSleG9eDjlboIOGvC8CCME-c2n8_N6N6Z2vjRy0O4-SvbY67FZQ9dNc-5s&s=10" alt="Imagen de ejemplo">
                            <audio controls>
                                <source src="audio/2.mp3" type="audio/mpeg">
                            </audio>
                            <video controls>
                                <source src="https://www.youtube.com/watch?v=3YNwcdVkpZQ" type="video/mp4">
                            </video>
                        </div>
                    </fieldset>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
